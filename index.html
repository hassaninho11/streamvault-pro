    <!-- Critical: Android Capacitor safe area fallback -->
    <!-- This script runs BEFORE React and ensures status bar spacing -->
    <script>
      (function() {
        // Detect if running in Capacitor on Android
        var ua = navigator.userAgent.toLowerCase();
        var isAndroid = ua.indexOf('android') > -1;
        var isCapacitor = typeof window.Capacitor !== 'undefined' || ua.indexOf('capacitor') > -1;
        
        // Also check for common Android WebView indicators
        var isWebView = ua.indexOf('wv') > -1 || ua.indexOf('webview') > -1;
        
        if (isAndroid && (isCapacitor || isWebView)) {
          // Apply 48px fallback for Android status bar
          // This will be overwritten by JS if SafeArea plugin works
          document.documentElement.style.setProperty('--safe-area-inset-top', '48px');
          console.log('[SafeArea] Android detected, applied 48px fallback');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
