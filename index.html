    <!-- Critical: Android/iOS Capacitor safe area fallback -->
    <!-- This script runs BEFORE React and ensures status bar spacing -->
    <script>
      (function() {
        var ua = navigator.userAgent || '';
        var isAndroid = /android/i.test(ua);
        var isIOS = /iphone|ipad|ipod/i.test(ua);
        var isMobile = /mobile|tablet/i.test(ua) || window.innerWidth < 1024;
        
        // Apply safe area for any mobile device to be safe
        if ((isAndroid || isIOS) && isMobile) {
          // Pixel 9 Pro XL needs ~60px, use 56px as safe default
          var topInset = isAndroid ? '56px' : '47px';
          document.documentElement.style.setProperty('--safe-area-inset-top', topInset);
          console.log('[SafeArea] Mobile detected, applied ' + topInset + ' fallback');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
